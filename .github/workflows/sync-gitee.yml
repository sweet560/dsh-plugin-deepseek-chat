name: Sync to Gitee

# GitHub 仓库 main 有更新后，自动把 main 与全部标签镜像到 Gitee。
on:
  push:
    branches: [main]
  workflow_dispatch: # 也支持在 Actions 页面手动点一次，方便测试

permissions:
  contents: read

# 避免多次推送同时改写 Gitee，排队执行而不是互相取消
concurrency:
  group: sync-gitee
  cancel-in-progress: false

jobs:
  mirror:
    name: 镜像 main 与标签到 Gitee
    runs-on: ubuntu-latest
    steps:
      - name: 拉取完整历史（含所有分支与标签）
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: 安装并校验 Gitee SSH 私钥
        env:
          GITEE_SSH_PRIVATE_KEY: ${{ secrets.GITEE_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${GITEE_SSH_PRIVATE_KEY:-}" ]; then
            echo "::error::GitHub 仓库 Secret GITEE_SSH_PRIVATE_KEY 未配置，无法推送到 Gitee"
            exit 1
          fi
          mkdir -p "$HOME/.ssh"

          # 统一换行：还原可能存在的字面量 \n、去掉 Windows 的 CR、补齐结尾换行。
          # 否则 ssh 会报 Load key ...: error in libcrypto
          printf '%s' "$GITEE_SSH_PRIVATE_KEY" \
            | sed 's/\\n/\n/g' \
            | tr -d '\r' \
            > "$HOME/.ssh/id_rsa"
          printf '\n' >> "$HOME/.ssh/id_rsa"
          chmod 600 "$HOME/.ssh/id_rsa"

          # 只诊断密钥「类型」，绝不打印密钥内容本身
          first=$(head -n 1 "$HOME/.ssh/id_rsa")
          echo "密钥首行类型：$(printf '%s' "$first" | awk '{print $1}')"
          echo "密钥字节数：$(wc -c < "$HOME/.ssh/id_rsa")"
          case "$first" in
            "-----BEGIN OPENSSH PRIVATE KEY-----"*|"-----BEGIN RSA PRIVATE KEY-----"*|"-----BEGIN PRIVATE KEY-----"*|"-----BEGIN EC PRIVATE KEY-----"*)
              echo "检测到 OpenSSH/PEM 格式私钥" ;;
            ssh-ed25519*|ssh-rsa*|ecdsa-sha2-*)
              echo "::error::Secret 里装的是「公钥」，不是私钥。请把 GITEE_SSH_PRIVATE_KEY 改成对应的私钥（以 -----BEGIN OPENSSH PRIVATE KEY----- 开头）。"
              exit 1 ;;
            "PuTTY-User-Key-File"*)
              echo "::error::Secret 里是 PuTTY PPK 私钥，OpenSSH 读不了。请用 PuTTYgen 的 Conversions → Export OpenSSH key 导出后重新填入。"
              exit 1 ;;
            *)
              if grep -q 'ENCRYPTED' "$HOME/.ssh/id_rsa"; then
                echo "::error::私钥带口令（passphrase），CI 无法交互输入。请改用一把无口令的专用密钥。"
                exit 1
              fi
              echo "::warning::密钥首行不是常见私钥格式，继续尝试加载以便给出确切错误。" ;;
          esac

          if ! ssh-keygen -y -f "$HOME/.ssh/id_rsa" > /dev/null; then
            echo "::error::ssh-keygen 无法加载该私钥（常见原因：内容被截断、含多余字符、带口令）。请完整复制私钥重新填入 Secret。"
            exit 1
          fi
          echo "私钥校验通过；推导出的公钥前缀：$(ssh-keygen -y -f "$HOME/.ssh/id_rsa" | awk '{print $1, substr($2,1,20)"..."}')"

      - name: 推送 main 与全部标签到 Gitee
        env:
          GITEE_REPO: git@gitee.com:wtt520wyl/dsh-plugin-deepseek-chat.git
        run: |
          set -euo pipefail
          export GIT_SSH_COMMAND="ssh -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes -i $HOME/.ssh/id_rsa"
          git remote add gitee "$GITEE_REPO"

          # 把 GitHub 侧的 main 与全部标签取到独立的 refs/sync 命名空间，
          # 不依赖 checkout 内部创建的 refs/remotes/origin/* 引用
          git fetch --quiet --force origin \
            '+refs/heads/main:refs/sync/main' \
            '+refs/tags/*:refs/tags/*'

          # 只推 main 与 tags，不推 refs/remotes、refs/pull 等本地引用
          # --force 让 Gitee 与 GitHub 对齐；--prune 清掉 Gitee 上多余的标签
          git push --force --prune gitee \
            'refs/sync/main:refs/heads/main' \
            'refs/tags/*:refs/tags/*'

          echo "=== 同步完成后 Gitee 上的引用 ==="
          git ls-remote gitee
