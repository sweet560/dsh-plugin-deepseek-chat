name: publish

on:
  push:
    branches: [main]
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # 关键：启用 OIDC

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # environment: npm-更新 # 如果 npm 端也配置了环境名，确保一致；否则可以注释掉
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # 关键：满足 ≥ 22.14.0
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm
        run: npm install -g npm@latest # 关键：确保 npm ≥ 11.5.1

      - name: Self-check
        run: npm test

      - name: Check if version is already published
        id: version
        shell: bash
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::$NAME@$VERSION already on npm - skip."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$NAME@$VERSION not published yet - will publish."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.version.outputs.should_publish == 'true'
        run: npm publish --provenance --access public
        # 关键：不要设置 NODE_AUTH_TOKEN 环境变量