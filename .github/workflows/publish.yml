name: publish

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要建 Release 的 tag（留空则自动取 HEAD 上的 tag 或 tag push 事件）'
        required: false
        type: string

permissions:
  contents: write # release job 需要创建 Release 与上传资产
  id-token: write # 关键：启用 OIDC

# 按「仓库」串行：同一 commit 被 push main 与 push tag 触发两次时，两个运行落入
# 同一并发组排队。先跑的发布成功后，后跑的运行由守卫跳过；万一因 npm 注册表
# 传播延迟仍撞上 E409（版本已由先跑的运行发布），视为成功、不再误报红叉。
concurrency:
  group: npm-publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24 # Node 24（Active LTS），满足 OIDC 可信发布的最低要求
          # OIDC 模式不需要 registry-url：npm 默认 registry 就是 npmjs.org；
          # 删掉可避免 setup-node 写出无效的 always-auth 与 NODE_AUTH_TOKEN 占位符

      - name: Upgrade npm
        run: npm install -g npm@latest # 关键：确保 npm ≥ 11.5.1

      - name: Self-check
        run: npm test

      - name: Check if version is already published
        id: version
        shell: bash
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # npm 注册表有传播延迟：按仓库串行后，前一个运行刚发布成功时，
          # 单次 npm view 可能仍读不到而误判「未发布」。轮询重试覆盖这个窗口。
          for attempt in 1 2 3 4 5 6; do
            if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
              echo "::notice::$NAME@$VERSION already on npm (check $attempt) - skip."
              echo "should_publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$attempt" -lt 6 ]; then sleep 5; fi
          done
          echo "::notice::$NAME@$VERSION not visible after 6 checks - will publish."
          echo "should_publish=true" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        if: steps.version.outputs.should_publish == 'true'
        shell: bash
        run: |
          # 关键：不要设置 NODE_AUTH_TOKEN 环境变量，认证走 OIDC。
          # 兜底：即使守卫因注册表传播延迟漏判，publish 撞上「另一串行运行已发布」
          # 的良性 E409 也不应让 CI 红叉。E409 本身就是「该版本已发布」的确定性
          # 信号；npm view 受注册表传播延迟影响可能查不到，因此不再把它当作成功的
          # 前提——只做一次 best-effort 观测写进日志，无论查不查得到都视为成功。
          set +e
          npm publish --provenance --access public 2>&1 | tee "$RUNNER_TEMP/npm-publish.log"
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -eq 0 ]; then
            echo "::notice::npm publish succeeded."
            exit 0
          fi
          if grep -qiE 'E409|409 Conflict|Cannot publish over previously staged version|previously published version' "$RUNNER_TEMP/npm-publish.log"; then
            NAME=$(node -p "require('./package.json').name")
            VERSION=$(node -p "require('./package.json').version")
            if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
              echo "::notice::$NAME@$VERSION already visible on npm (benign E409) - treating as success."
            else
              echo "::notice::$NAME@$VERSION not yet visible (npm propagation delay); E409 already proves the version is published - treating as success."
            fi
            exit 0
          fi
          echo "::error::npm publish failed (code=$code), not a benign E409."
          cat "$RUNNER_TEMP/npm-publish.log"
          exit "$code"

  # 建 Release 并上传 tgz：解决「发布完发行版是空的/最新的没上」的问题。
  # 完全幂等：已有同 tag 的 Release/资产会复用/覆盖，重复触发不会重复建。
  release:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      # 始终检出 main：release 脚本在 main 上；inputs.tag 只是建 Release 的目标 tag，
      # 若按 tag 检出会拿到旧 commit（脚本尚未加入），导致找不到脚本。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          INPUT_TAG="${{ inputs.tag }}"
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG=$(git tag --points-at HEAD | head -n 1)
          fi
          if [ -z "$TAG" ]; then
            echo "::notice::未找到可建 Release 的 tag，跳过 release job。"
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "解析到 tag: $TAG"

      - name: Pack tgz
        if: steps.tag.outputs.tag != ''
        id: pack
        shell: bash
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          TGZ=$(ls "$RUNNER_TEMP"/*.tgz | head -n 1)
          echo "tgz=$TGZ" >> "$GITHUB_OUTPUT"
          echo "打包: $TGZ"

      - name: Create or refresh GitHub Release
        if: steps.tag.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          TGZ: ${{ steps.pack.outputs.tgz }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::GitHub Release $TAG 已存在，复用。"
          else
            gh release create "$TAG" \
              --title "$TAG 全自动流程初步真机验证通过" \
              --notes "全自动流程初步真机验证通过（持续完善中）。安装：下载本 Release 的 tgz 用 DSH 插件管理器安装，或在插件市场搜索 deepseek-chat。" \
              "$TGZ"
            echo "::notice::GitHub Release $TAG 已创建。"
          fi
          # 幂等上传资产：--clobber 覆盖同名，重复运行不报错
          gh release upload "$TAG" "$TGZ" --clobber
          echo "::notice::tgz 资产已上传到 GitHub Release $TAG。"

      - name: Create or refresh Gitee Release
        if: steps.tag.outputs.tag != ''
        env:
          GITEE_API_TOKEN: ${{ secrets.GITEE_API_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          TGZ: ${{ steps.pack.outputs.tgz }}
          GITHUB_SHA: ${{ github.sha }}
        run: python .github/scripts/gitee-release.py
